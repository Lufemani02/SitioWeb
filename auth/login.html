<body style="background-color: #f4f6f9;">
        <!-- Botón hamburguesa -->
    <button id="menu-toggle">☰</button>
    <!-- Menú lateral -->
    <nav id="side-menu">
        <a href="/index.html">Inicio</a>
    </nav>
    <div class="centrar">
        <img src="/modules/cliente/img/logo3.jfif" alt="logo-empresa" class="logo">

<!-- Login -->
  <div class="modal-content" id="iniciar-sesion">
    <h2 style="text-align: center; margin: 2rem;">INICIAR SESIÓN</h2>
    <form>
      <label for="login-email"><b>Correo</b></label>
      <input id="login-email" type="email" placeholder="Ingrese Su correo" required/>
      <label for="login-password"><b>Contraseña</b></label>
      <input id="login-password" type="password" placeholder="Ingrese Su contraseña"required/>
      <a href="/auth/registro.html"> ¿No tienes cuenta? Registrate</a>
      <a href="/auth/reset.html">¿Olvidaste tu contraseña?</a>
      <button type="button" onclick="login()" >Ingresar</button>
    </form>
  </div>
  <script src="/shared/js/script.js"></script>
</body>
