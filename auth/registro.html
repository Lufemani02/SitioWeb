  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<body style="background-color: #f4f6f9;">
  <header>
        <!-- Botón hamburguesa -->
    <button id="menu-toggle">☰</button>
    <!-- Menú lateral -->
    <nav id="side-menu">
        <a href="/index.html">Inicio</a>
        <a href="/auth/login.html">Iniciar Sesión</a>
    </nav>
    <div class="centrar">
        <img src="/modules/cliente/img/logo3.jfif" alt="logo-empresa" class="logo">
    </div>
<!-- Login -->
  <div class="modal-content" id="iniciar-sesion">
    <h2 style="text-align: center; margin: 2rem;">Registro de Usuario</h2>
    <form>
      <input id="nombre" type="text"  placeholder="Nombre" required />
      <input id="email" type="email"  placeholder="Correo" required />
      <input id="password" type="password"  placeholder="Contraseña" required />
      <input id="confirmPassword" type="password"  placeholder="Confirmar Contraseña" required />
      <p id="msg"></p>
      <button type="button" onclick="registrar(event)" >Continuar</button>
    </form>
  </div>
  </header>  
 <script src="/auth/js/registro_usuario.js"></script>
 <script src="/shared/js/script.js"></script>
</body>
</html>
