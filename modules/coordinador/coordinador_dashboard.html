<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Coordinador</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="/shared/js/firebase-config.js"></script>
  <script src="/modules/coordinador/js/coordinador.js" defer></script>
  <script src="/shared/js/auth.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body style="background-color: #f4f6f9;">
        <!-- Botón hamburguesa -->
    <button id="menu-toggle">☰</button>
    <!-- Menú lateral -->
    <nav id="side-menu">
      <div class="centrar">
          <img src="/modules/cliente/img/logo3.jfif" alt="logo-empresa" class="logo">
      </div>
      <a class="active" href="/modules/coordinador/coordinador_dashboard.html">Dashboard</a>
      <a onclick="logout()">Cerrar Sesión</a>               
  </nav>
  <div class="container">
    <h1>Dashboard Coordinador</h1>
    <p>Gestión y asignación de órdenes de trabajo</p>

    <!-- STATS -->
    <div class="stats">

      <div class="card-stat">
        <p>Órdenes Pendientes</p>
        <h2 id="pendientes">0</h2>
      </div>

      <div class="card-stat">
        <p>En Proceso</p>
        <h2 id="proceso">0</h2>
      </div>

      <div class="card-stat">
        <p>Finalizadas</p>
        <h2 id="finalizadas">0</h2>
      </div>

      <div class="card-stat">
        <p>Sin Asignar</p>
        <h2 id="sinAsignar">0</h2>
      </div>

    </div>

    <!-- SIN ASIGNAR -->
    <div class="card">
      <h3>Órdenes Sin Asignar</h3>
      <div id="listaSinAsignar"></div>
    </div>

    <!-- EN PROCESO -->
    <div class="card">
      <h3>Órdenes en Proceso</h3>
      <div id="listaProceso"></div>
    </div>
    </div>
<script src="/shared/js/script.js"></script>
</body>
</html>
